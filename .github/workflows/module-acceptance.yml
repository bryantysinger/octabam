name: Acceptance runner tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance-runner:
    # No firmware, private projects, secrets, flashing, or acceptance claims.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test-acceptance
